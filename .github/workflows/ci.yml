name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "POSTGRES_USER=user" >> .env
          echo "POSTGRES_PASSWORD=password" >> .env
          echo "POSTGRES_DB=trading_db_test" >> .env
          echo "DB_AGENT_URL=http://db-agent:8001" >> .env

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Run full test suite
        id: pytest
        continue-on-error: true
        run: |
          docker compose run --rm learning-agent-ci \
            pytest -q --tb=short > pytest-results.txt 2>&1

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-pytest-results
          path: pytest-results.txt
          if-no-files-found: error

      - name: Fail when pytest fails
        if: steps.pytest.outcome == 'failure'
        run: |
          cat pytest-results.txt
          exit 1

      - name: Clean up containers
        if: always()
        run: docker compose down --volumes --remove-orphans
